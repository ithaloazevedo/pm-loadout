# Knowledge Graph — Relações Estruturadas
#
# Formato de cada relação:
#   from:       entidade de origem
#   relation:   tipo da relação (verbo)
#   to:         entidade de destino
#   domain:     domínio(s) envolvidos
#   valid_from: data em que a relação foi estabelecida (YYYY-MM-DD)
#   valid_until: data de expiração, se conhecida (omitir se indefinida)
#
# Para legibilidade humana e narrativas, ver relations.md.
# Para decisões que alteram relações, registrar em knowledge/decisions/.

relations:

